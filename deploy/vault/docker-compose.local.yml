services:
  vault:
    image: hashicorp/vault:latest
    container_name: emat-vault
    ports:
      - "8200:8200"
    environment:
      # Dev-only root token. Spring Cloud Vault reads it via the VAULT_TOKEN env var.
      VAULT_DEV_ROOT_TOKEN_ID: emat-local-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    stdin_open: true
    tty: true