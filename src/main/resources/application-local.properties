# Local Profile (used for local development)
# Vault connection - local dev server (see docs/VAULT.md)
# Authentication: token. Set VAULT_TOKEN env var to the dev root token (or a dev policy token).
spring.cloud.vault.host=localhost
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=${VAULT_TOKEN:}

# JWT / datasource / PII secrets are loaded from Vault path secret/emat/local

# PII testing helper endpoints (LOCAL DEV ONLY)
pii.testing-endpoint.enabled=true

# PII encryption key endpoint (LOCAL DEV ONLY)
pii.key-endpoint.enabled=true

# File storage base for local development
file.storage.base=C:/Users/Chait/Desktop/EOIFiles
file.download.base=http://localhost:8086/files

# More verbose logging for local development
logging.level.org.emat=DEBUG