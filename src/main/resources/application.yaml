server:
  port: 8086
  servlet:
    context-path: /emat/v1
spring:
  application:
    name: emat

  config:
    import: vault://

  cloud:
    vault:
      scheme: ${VAULT_SCHEME:https}
      host: ${VAULT_HOST:vault-emat.metaversedu.in}
      port: ${VAULT_PORT:443}

      authentication: APPROLE

      app-role:
        role-id: ${VAULT_ROLE_ID}
        secret-id: ${VAULT_SECRET_ID}

      fail-fast: true

      kv:
        enabled: true
        backend: secret
        backend-version: 2
        application-name: emat
        default-context: emat

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      auto-commit: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  threads:
    virtual:
      enabled: true

security:
  captcha:
    # Backend-managed CAPTCHA for the login endpoint.
    enabled: ${SECURITY_CAPTCHA_ENABLED:true}
    expiry-in-seconds: 300
    length: 5
    image:
      width: 180
      height: 60

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.emat: INFO
    org.hibernate.SQL: INFO