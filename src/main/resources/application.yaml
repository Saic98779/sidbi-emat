server:
  port: 8086
  servlet:
    context-path: /emat/v1
spring:
  application:
    name: emat

  profiles:
    active: prod

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@//51.79.165.43:1521/EMAT
    username: EMAT
    password: nNexjMg5vyEf
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      auto-commit: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  threads:
    virtual:
      enabled: true

  # SMTP settings used to send forgot-password OTP emails.
  # Supply real credentials via environment variables (never commit the SMTP password).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply.metaversedu@gmail.com}
    password: ${MAIL_PASSWORD:qppvjwcbxuhuknuc}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

jwt:
  secret: EMATSecretKeyForJwtSigningMustBeAtLeast32BytesLong123!

pii:
  encryption:
    secret-key: QQEXbMtwd/wTfup0HyhW/b+40jdVupAvnYDwE2nRu7E=

security:
  captcha:
    # Backend-managed CAPTCHA for the login endpoint.
    enabled: ${SECURITY_CAPTCHA_ENABLED:true}
    expiry-in-seconds: 300
    length: 5
    image:
      width: 180
      height: 60
  # Password OTP settings for forgot / reset password
  # (POST /auth/forgot-password, /auth/verify-otp, /auth/reset-password).
  # Change password (POST /users/change-password) uses no OTP.
  password-reset:
    # Sender address for OTP emails (defaults to the SMTP username).
    mail-from: ${MAIL_FROM:${spring.mail.username:}}
    mail-subject: "EMAT - Password Reset Verification Code"
    change-mail-subject: "EMAT - Change Password Verification Code"
    # Key used to hash stored OTPs / reset tokens (min 32 chars). Defaults to jwt.secret.
    hash-secret: ${PASSWORD_OTP_HASH_SECRET:${jwt.secret}}
    # New passwords need this many characters (min 8, max 64) plus upper, lower, digit, special.
    min-password-length: 8
    otp-expiry-minutes: 5
    # Wrong-OTP attempts allowed before the OTP is invalidated.
    max-attempts: 5
    # Minimum gap between two OTP requests for the same email.
    resend-cooldown-seconds: 60
    # Lifetime of the reset token issued after a successful OTP verification.
    reset-token-expiry-minutes: 10
  # Welcome email sent to a user after successful registration (POST /users).
  # Uses the same SMTP settings and sender (password-reset.mail-from) as the OTP emails.
  welcome-mail:
    enabled: ${WELCOME_MAIL_ENABLED:true}
    subject: "Welcome to EMAT"
    # Optional login page link included in the email; leave empty to omit it.
    login-url: ${WELCOME_MAIL_LOGIN_URL:}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.emat: INFO
    org.hibernate.SQL: INFO

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: ""