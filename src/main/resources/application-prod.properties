# Production Profile
# Vault connection - production server (see docs/VAULT.md)
# Authentication: AppRole. Set VAULT_ROLE_ID_V2 and VAULT_SECRET_ID env vars (docker run -e).
spring.cloud.vault.host=${VAULT_HOST:CHANGE_ME}
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID:}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID:}

# JWT / datasource / PII secrets are loaded from Vault path secret/emat/prod

# PII testing helper endpoints - never enabled in production
pii.testing-endpoint.enabled=false

# Reject plain-text PII/identifier values on inbound requests (default true)
pii.strict-encryption.enabled=true

# File storage base for production server
file.storage.base=/home/ubuntu/uploads/emat
file.download.base=/files